name: registro-mascotas

services:
  mysql:
    image: mysql:8.4
    container_name: mascotas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  eureka-server:
    image: registro-mascotas/eureka-server:latest
    build:
      context: ./eureka-server
    container_name: mascotas-eureka
    restart: unless-stopped
    environment:
      SERVER_PORT: "8761"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx384m"
    ports:
      - "8761:8761"

  gateway:
    image: registro-mascotas/gateway:latest
    build:
      context: ./gateway
    container_name: mascotas-gateway
    restart: on-failure
    environment:
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx512m"
    ports:
      - "8080:8080"
    depends_on:
      - eureka-server

  usuarios:
    image: registro-mascotas/usuarios:latest
    build:
      context: ./usuarios
    container_name: mascotas-usuarios
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/usuarios_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx512m"
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  mascotas:
    image: registro-mascotas/mascotas:latest
    build:
      context: ./mascotas
    container_name: mascotas-mascotas
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/mascotas_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx512m"
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  salud:
    image: registro-mascotas/salud:latest
    build:
      context: ./salud
    container_name: mascotas-salud
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/salud_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx512m"
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  citas:
    image: registro-mascotas/citas:latest
    build:
      context: ./citas
    container_name: mascotas-citas
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/citas_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx512m"
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

  recordatorios:
    image: registro-mascotas/recordatorios:latest
    build:
      context: ./recordatorios
    container_name: mascotas-recordatorios
    restart: on-failure
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/recordatorios_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx512m"
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started

volumes:
  mysql-data:
